name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/foundation.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-unconfigured
          path: test-results/
          retention-days: 3
  database-and-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_AUTH_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - name: Export isolated local test configuration
        shell: bash
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          source "$RUNNER_TEMP/supabase-local.env"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/supabase-local.env"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Do not upload authenticated traces: they can contain cookies and credentials.
      - run: npx supabase stop --no-backup
        if: always()
