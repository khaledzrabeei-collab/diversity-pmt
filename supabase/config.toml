project_id = "diversity-pmt"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
[auth.email]
# CLI maps this flag to the email provider switch. Keep password login enabled;
# [auth].enable_signup = false above independently blocks self-registration.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
[auth.email.template.invite]
subject = "Your Diversity PMT invitation"
content_path = "./supabase/templates/invite.html"
[auth.rate_limit]
sign_in_sign_ups = 10
token_refresh = 150
token_verifications = 30
